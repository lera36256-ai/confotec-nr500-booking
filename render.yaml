# Confotec NR500 — общая система записи

Готовый сайт для записи на:

**Рамановский микроскоп Confotec NR500 (Белоруссия, 2022)**

## Что уже работает

- общий календарь;
- ФИО;
- подразделение / лаборатория;
- контакт;
- дата и время;
- информация об образцах;
- комментарий;
- запрет пересекающихся записей;
- все пользователи видят одну и ту же базу, если сайт размещён на сервере;
- PostgreSQL в интернете;
- SQLite автоматически используется только для локального запуска.

## Самый простой вариант публикации

Проект подготовлен для Render.

1. Создайте бесплатный аккаунт GitHub.
2. Создайте новый репозиторий и загрузите в него ВСЕ файлы из этой папки.
3. Зайдите на Render.com.
4. Выберите **New → Blueprint**.
5. Подключите ваш GitHub-репозиторий.
6. Render прочитает `render.yaml` и создаст:
   - веб-сайт;
   - общую PostgreSQL-базу данных.
7. После завершения Render выдаст ссылку вида:
   `https://confotec-nr500-booking.onrender.com`

Эту ссылку можно отправить сотрудникам — все будут видеть один календарь.

## Локальный запуск (необязательно)

Если установлен Python:

```bash
pip install -r requirements.txt
uvicorn app:app --reload
```

После этого открыть:
http://127.0.0.1:8000

При локальном запуске база хранится в `bookings.db`.

## Важно

В текущей версии нет авторизации и пароля администратора.
Удаление записей через интерфейс также специально не добавлено, чтобы случайный
пользователь не мог удалить чужую запись.

Следующим шагом можно добавить:
- вход по логину/паролю;
- администратора;
- удаление/редактирование только своих записей;
- подтверждение записи ответственным за прибор;
- блокировку времени на обслуживание;
- e-mail уведомления.
